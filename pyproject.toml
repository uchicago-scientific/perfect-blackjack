[project]
name = "perfect-blackjack"
version = "0.1.0"
description = "MPCS 56430 Module 8: blackjack by simulation, as a Slurm job array, with MPI and with multiprocessing"
requires-python = ">=3.13"
dependencies = [
    "matplotlib",
    "mpi4py",
    "mpich",
    "numpy",
]

# Install blackjack.py as a module, so the scripts in slurm/, mpi/ and
# multiprocessing/ can all import it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["blackjack.py"]
